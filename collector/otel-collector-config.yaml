# OTel Collector Gateway · PlusPay
# Owner: Plataforma de Confiabilidad · Runbook: README.md

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Semántica de negocio: el código HTTP no es fuente de verdad del resultado transaccional.
  # Contrato: cabeceras X-Business-* capturadas por el agente Java (cero cambios de código).
  # Corre antes de span_metrics: el Error Budget solo refleja fallas técnicas reales.
  transform/business-semantics:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["business.operation"], attributes["http.response.header.x-business-operation"][0]) where attributes["http.response.header.x-business-operation"] != nil
          - set(attributes["business.outcome"], attributes["http.response.header.x-business-outcome"][0]) where attributes["http.response.header.x-business-outcome"] != nil
          - set(attributes["business.reason"], attributes["http.response.header.x-business-reason"][0]) where attributes["http.response.header.x-business-reason"] != nil
          - delete_matching_keys(attributes, "^http\\.response\\.header\\.x-business-.*")
          # Rechazo de negocio expuesto como 5xx: no consume Error Budget ni dispara alertas
          - set(attributes["business.status_reclassified"], "declined_as_5xx") where attributes["business.outcome"] == "declined" and status.code == STATUS_CODE_ERROR
          - set(status.code, STATUS_CODE_UNSET) where attributes["business.status_reclassified"] == "declined_as_5xx"
          # Falla de sistema oculta en 2xx: consume Error Budget y se retiene al 100% para RCA
          - set(attributes["business.status_reclassified"], "failed_as_2xx") where attributes["business.outcome"] == "failed" and status.code != STATUS_CODE_ERROR
          - set(status.code, STATUS_CODE_ERROR) where attributes["business.status_reclassified"] == "failed_as_2xx"
          - set(status.message, Concat(["business.reason=", attributes["business.reason"]], "")) where attributes["business.status_reclassified"] == "failed_as_2xx"
          # Banda de monto: segmentación de impacto sin exponer el valor exacto en dashboards
          - set(attributes["business.amount_band"], "bajo") where attributes["payment.amount"] != nil and attributes["payment.amount"] < 1000000
          - set(attributes["business.amount_band"], "medio") where attributes["payment.amount"] != nil and attributes["payment.amount"] >= 1000000 and attributes["payment.amount"] < 50000000
          - set(attributes["business.amount_band"], "alto") where attributes["payment.amount"] != nil and attributes["payment.amount"] >= 50000000

  # Enmascaramiento PII (PCI-DSS / SFC CE 007/2018 / Ley 1581/2012) aplicado en Edge.
  # Ningún exporter recibe datos sin pasar por este procesador.
  transform/pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Hash con sal: preserva correlación por cliente sin exponer el identificador
          - set(attributes["account.number"], SHA256(Concat([attributes["account.number"], "${env:PII_HASH_SALT}"], ""))) where attributes["account.number"] != nil
          - set(attributes["customer.document"], SHA256(Concat([attributes["customer.document"], "${env:PII_HASH_SALT}"], ""))) where attributes["customer.document"] != nil
          # PCI-DSS req. 3.2: datos sensibles de autenticación no se almacenan
          - delete_matching_keys(attributes, "(?i)(^|[._])(cvv|cvc|pin|password|passwd|secret|token|authorization)($|[._])")
          # PCI-DSS req. 3.4: PAN truncado a últimos 4 ($$ = escape de interpolación)
          - replace_all_patterns(attributes, "value", "\\b\\d{4}[ -]?\\d{4}[ -]?\\d{4}[ -]?(\\d{4})\\b", "****-****-****-$$1")
          - replace_all_patterns(attributes, "value", "\\b3[47]\\d{2}[ -]?\\d{6}[ -]?(\\d{5})\\b", "****-******-$$1")
          # Email literal o URL-encoded (%40): los agentes registran url.query codificado
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+(@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL_REDACTADO]")
          # Fail-closed: cuentas, cédulas y celulares. Excepciones vía PR a DevSecOps.
          - replace_all_patterns(attributes, "value", "\\b\\d{6,12}\\b", "[NUM_REDACTADO]")
          - replace_pattern(name, "\\b\\d{6,19}\\b", "{id}")
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "\\b\\d{4}[ -]?\\d{4}[ -]?\\d{4}[ -]?(\\d{4})\\b", "****-****-****-$$1")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+(@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL_REDACTADO]")
          - replace_all_patterns(attributes, "value", "\\b\\d{6,12}\\b", "[NUM_REDACTADO]")
      - context: resource
        statements:
          - delete_matching_keys(attributes, "(?i).*(password|secret|token).*")

  # FinOps: muestreo post-análisis. Políticas en OR; descarte del 95% del tráfico exitoso.
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000               # dimensionado: TPS pico × decision_wait × 10
    expected_new_traces_per_sec: 1000
    decision_cache:
      sampled_cache_size: 100000
    policies:
      # SLA Compliance: retención del 100% de fallas técnicas para RCA. Se evalúa el estado
      # normalizado por transform/business-semantics, no el código HTTP: incluye errores ocultos
      # en 2xx y excluye rechazos de negocio expuestos como 5xx.
      - name: retener-errores
        type: status_code
        status_code:
          status_codes: [ERROR]
      # SLO latencia p95 < 800 ms: toda traza fuera de umbral se conserva
      - name: retener-lentas
        type: latency
        latency:
          threshold_ms: 800
      # Prevención de fraude: operaciones ≥ 50 M COP y anomalías marcadas upstream
      - name: retener-alto-valor
        type: numeric_attribute
        numeric_attribute:
          key: payment.amount
          min_value: 50000000
          max_value: 9999999999999
      - name: retener-anomalias
        type: string_attribute
        string_attribute:
          key: payment.anomaly
          values: ["true"]
      - name: linea-base-exitosas
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

  batch:
    send_batch_size: 1024
    timeout: 5s

  # El connector count emite deltas por lote; Prometheus requiere contadores acumulados
  deltatocumulative: {}

connectors:
  # Fuente de verdad del Error Budget: se calcula sobre el 100% del tráfico, antes del muestreo
  span_metrics:
    histogram:
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 800ms, 1s, 2s, 5s]
    dimensions:
      - name: service.version          # habilita análisis canary por release
      - name: business.outcome         # embudo approved / declined / failed
      - name: http.response.status_code
      - name: payment.channel
    metrics_flush_interval: 15s

  forward/sampling: {}

  # Log-to-Metrics en el Edge: el log crudo (stack traces con PAN y cuentas incluidos) no sale del
  # Gateway; solo su conteo por servicio y severidad. Visibilidad de errores sin costo de almacenamiento.
  count:
    logs:
      app.log.records:
        description: Registros de log recibidos por servicio
        attributes:
          - key: service.name
      app.log.errors:
        description: Registros de log con severidad ERROR o superior por servicio
        conditions:
          - severity_number >= SEVERITY_NUMBER_ERROR
        attributes:
          - key: service.name

exporters:
  # Dual-Shipping durante la ventana de transición: APM legado (Dynatrace, ingesta OTLP/HTTP)
  # y backend OTel agnóstico. Cutover (F3) = retirar otlp_http/dynatrace del pipeline.
  otlp_http/dynatrace:
    endpoint: ${env:DT_OTLP_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

  # Elastic APM / Grafana Tempo / otro: intercambiable sin tocar las aplicaciones
  otlp_grpc/backend-otel:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/ingest:
      receivers: [otlp]
      processors: [memory_limiter, transform/business-semantics, transform/pii]
      exporters: [span_metrics, forward/sampling]
    traces/export:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch]
      exporters: [otlp_http/dynatrace, otlp_grpc/backend-otel]
    metrics/red:
      receivers: [span_metrics]
      processors: [batch]
      exporters: [prometheus]
    logs/ingest:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [count]
    metrics/logs:
      receivers: [count]
      processors: [deltatocumulative, batch]
      exporters: [prometheus]
